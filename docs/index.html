  <body class="bg-[#FAF8F2] text-[#123B5D] antialiased selection:bg-[#2F8F89]/20 selection:text-[#123B5D]">
    <div id="root"></div>
    <script>
      // Fallback helper in case uncompiled source is served directly on GitHub Pages
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var rootEl = document.getElementById('root');
          if (rootEl && (!rootEl.firstElementChild || rootEl.children.length === 0)) {
            var isGH = window.location.hostname.indexOf('github.io') !== -1;
            rootEl.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;direction:rtl;text-align:center;background:#FAF8F2;">' +
              '<div style="background:#ffffff;border:1px solid #CBD5E1;border-radius:24px;box-shadow:0 10px 25px rgba(0,0,0,0.06);padding:32px;max-width:540px;width:100%;">' +
              '<div style="width:52px;height:52px;border-radius:16px;background:#FEF3C7;color:#D97706;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px auto;">⚙️</div>' +
              '<h2 style="color:#123B5D;font-size:18px;font-weight:bold;margin:0 0 10px 0;">خطوة أخيرة لتشغيل الموقع على GitHub Pages</h2>' +
              '<p style="color:#4B5563;font-size:13px;line-height:1.7;margin:0 0 18px 0;">' +
              (isGH ? 
                'تم ضبط النشر حالياً على المجلد المصدري بدلاً من مجلد البناء الجاهز.<br>لحل ذلك خلال ثوانٍ، اذهبي لمستودعك على GitHub:<br><br>' +
                '1. اضغطي <b>Settings</b> &larr; <b>Pages</b><br>' +
                '2. عند خانة <b>Branch</b> غيّري المجلد من <b>/(root)</b> إلى <b>/docs</b> ثم اضغطي <b>Save</b>.<br>' +
                'أو اختاري <b>GitHub Actions</b> من خانة Source.' :
                'جاري تجهيز عناصر الموقع...') +
              '</p>' +
              '</div></div>';
          }
        }, 1500);
      });
    </script>
